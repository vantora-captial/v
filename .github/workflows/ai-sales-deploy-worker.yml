name: Deploy AI Sales Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    if: github.ref == 'refs/heads/ai-sales-redesign'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ai-sales-redesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run Worker tests
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Validate required deployment secrets
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -eu
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENAI_API_KEY RESEND_API_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Upload OpenAI Worker secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY

      - name: Upload Resend Worker secret
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy-output.txt
          worker_url=$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy-output.txt | tail -n 1 || true)
          if [ -z "$worker_url" ]; then
            echo "Deployment completed but no workers.dev URL was detected in Wrangler output."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "### AI Sales Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "$worker_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error "${{ steps.deploy.outputs.worker_url }}/health"
          echo
          echo "Health check passed."
