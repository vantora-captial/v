name: Deploy Vantora Preview

on:
  push:
    branches: ["ai-sales-redesign", "trilingual-public-site"]
    paths:
      - "index.html"
      - "en/**"
      - "zh/**"
      - "ja/**"
      - "site/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Publishes only an isolated public presentation surface. It never modifies the production top branch.
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: vantora-site-preview
      VANTORA_OPPORTUNITY_MODE: presentation
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -eu
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build public-only presentation preview
        shell: bash
        run: |
          set -eu
          VANTORA_OPPORTUNITY_MODE=presentation node scripts/build-site.mjs
          rm -rf preview-dist
          mkdir -p preview-dist
          cp index.html preview-dist/index.html
          cp -R en zh ja assets preview-dist/
          test ! -e preview-dist/registry
          test ! -e preview-dist/worker
          test ! -e preview-dist/docs
          test ! -e preview-dist/site
          test ! -e preview-dist/scripts
          test ! -e preview-dist/admin.html
          test ! -e preview-dist/server.mjs
          grep -q 'Presentation sample' en/opportunities/index.html || grep -q 'data-opportunity-mode="presentation"' en/opportunities/index.html

      - name: Ensure preview project exists
        shell: bash
        run: |
          set -eu
          if ! npx --yes wrangler@4 pages project list | grep -q "$PREVIEW_PROJECT"; then
            npx --yes wrangler@4 pages project create "$PREVIEW_PROJECT" --production-branch ai-sales-redesign
          fi

      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy preview-dist \
            --project-name "$PREVIEW_PROJECT" \
            --branch trilingual-public-site \
            --commit-hash "$GITHUB_SHA" 2>&1 | tee preview-deploy.txt
          preview_url=$(grep -Eo 'https://[^ ]+\.pages\.dev' preview-deploy.txt | tail -n 1 || true)
          if [ -z "$preview_url" ]; then
            echo "Preview deployment completed but no pages.dev URL was detected."
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Vantora Trilingual Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable review URL: https://${PREVIEW_PROJECT}.pages.dev/en/" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify stable trilingual preview
        shell: bash
        run: |
          set -eu
          base="https://${PREVIEW_PROJECT}.pages.dev"
          for attempt in 1 2 3 4 5 6; do
            en=$(curl --fail --silent --show-error "$base/en/" || true)
            zh=$(curl --fail --silent --show-error "$base/zh/" || true)
            ja=$(curl --fail --silent --show-error "$base/ja/" || true)
            if printf '%s' "$en" | grep -q 'Cross-Border M&amp;A &amp; Strategic Investment in Japan' \
              && printf '%s' "$zh" | grep -q '專注日本的跨境併購與戰略投資' \
              && printf '%s' "$ja" | grep -q '日本におけるクロスボーダーM&amp;A・戦略投資'; then
              echo "Preview checks passed: $base/en/ $base/zh/ $base/ja/"
              exit 0
            fi
            echo "Preview check attempt $attempt failed; retrying in 5 seconds..."
            sleep 5
          done
          echo "Stable preview did not become ready in time."
          exit 1
