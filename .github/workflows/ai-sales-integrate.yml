name: Integrate AI Sales Homepage Hooks

on:
  push:
    branches: ["ai-sales-redesign"]
    paths:
      - ".github/workflows/ai-sales-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ai-sales-redesign
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inject AI sales hooks
        run: node scripts/inject-ai-sales.mjs
      - name: Commit integration when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage integration change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: integrate AI sales concierge into homepage"
          git push origin HEAD:ai-sales-redesign
