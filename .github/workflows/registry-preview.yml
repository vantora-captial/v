name: Deploy Registry Preview

on:
  push:
    branches: ["registry-phase1"]
    paths:
      - "registry/**"
      - ".github/workflows/registry-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

# Presentation-only preview. It contains sample data only and does not deploy the registry Worker or production resources.
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: vantora-registry-preview
    steps:
      - name: Checkout registry branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -eu
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build presentation directory
        shell: bash
        run: |
          set -eu
          rm -rf registry-preview-dist
          mkdir registry-preview-dist
          cp registry/index.html registry-preview-dist/index.html
          cp registry/styles.css registry-preview-dist/styles.css
          cp registry/app.js registry-preview-dist/app.js
          cp registry/demo.js registry-preview-dist/demo.js

      - name: Ensure preview project exists
        shell: bash
        run: |
          set -eu
          if ! npx --yes wrangler@4 pages project list | grep -q "$PREVIEW_PROJECT"; then
            npx --yes wrangler@4 pages project create "$PREVIEW_PROJECT" --production-branch registry-phase1
          fi

      - name: Deploy presentation preview
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy registry-preview-dist \
            --project-name "$PREVIEW_PROJECT" \
            --branch registry-phase1 \
            --commit-hash "$GITHUB_SHA" 2>&1 | tee registry-preview-deploy.txt
          preview_url=$(grep -Eo 'https://[^ ]+\.pages\.dev' registry-preview-deploy.txt | tail -n 1 || true)
          if [ -z "$preview_url" ]; then
            echo "Registry preview deployment completed but no pages.dev URL was detected."
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Registry Presentation Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url/?demo=1" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify presentation preview
        shell: bash
        run: |
          set -eu
          url="${{ steps.deploy.outputs.preview_url }}/?demo=1"
          for attempt in 1 2 3 4 5 6; do
            html=$(curl --fail --silent --show-error "$url" || true)
            if printf '%s' "$html" | grep -q 'Vantora Project Registry'; then
              echo "Registry preview check passed: $url"
              exit 0
            fi
            echo "Preview check attempt $attempt failed; retrying in 5 seconds..."
            sleep 5
          done
          echo "Registry preview did not become ready in time."
          exit 1
