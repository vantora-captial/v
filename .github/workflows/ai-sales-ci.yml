name: AI Sales CI

on:
  push:
    branches: ["ai-sales-redesign", "trilingual-public-site"]
    paths:
      - "index.html"
      - "en/**"
      - "zh/**"
      - "ja/**"
      - "site/**"
      - "scripts/**"
      - "worker/**"
      - "assets/ai-sales*"
      - "assets/site*"
      - "assets/ja-*"
      - "assets/opportunities.mjs"
      - "assets/presentation-opportunities.mjs"
      - "assets/contact.mjs"
      - "tests/frontend/**"
      - "docs/superpowers/**"
      - ".github/workflows/ai-sales-ci.yml"
      - ".github/workflows/preview-pages.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install
      - name: Generate Worker types
        run: npm run types
      - name: Typecheck Worker source
        run: npx tsc --noEmit
      - name: Run Worker tests
        run: npm test
      - name: Wrangler dry run
        if: ${{ success() && hashFiles('worker/src/index.ts') != '' }}
        run: npx wrangler deploy --dry-run --outdir dist

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build trilingual site
        run: node scripts/build-site.mjs
      - name: Run frontend tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/frontend/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No frontend tests found"
            exit 1
          fi
          node --test "${tests[@]}"
      - name: Audit generated public output
        shell: bash
        run: |
          set -eu
          if grep -R -n -E 'OPENAI_API_KEY|RESEND_API_KEY|sk-proj-|Bearer sk-|\$847M AUM|guaranteed return|exclusive opportunity' index.html en zh ja assets --exclude='*.svg'; then
            echo "Forbidden secret or unsupported public claim found"
            exit 1
          fi
          echo "Public output audit passed"
